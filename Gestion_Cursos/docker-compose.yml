services:
  gestion-cursos-service:
    build: .
    ports:
      - "5003:5003"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-gestion-cursos:3306/gestion_cursos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      db-gestion-cursos:
        condition: service_healthy

  db-gestion-cursos:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gestion_cursos
      MYSQL_USER: microservicio
      MYSQL_PASSWORD: system
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

services:
  direcciones-service:
    build: .
    ports:
      - "7000:7000"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-direcciones:3306/direccion?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      db-direcciones:
        condition: service_healthy

  db-direcciones:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: direccion
      MYSQL_USER: direcciones
      MYSQL_PASSWORD: system
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

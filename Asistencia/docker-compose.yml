services:
  asistencia-service:
    build: .
    ports:
      - "5005:5005"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-asistencia:3306/db_asistencia?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    depends_on:
      db-asistencia:
        condition: service_healthy

  db-asistencia:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: db_asistencia
      MYSQL_USER: asistencia
      MYSQL_PASSWORD: system
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
